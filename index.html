<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>추석 Trip · Interactive Itinerary Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
<style>
  :root {
    --bg: #f7f5f0;
    --panel: #ffffff;
    --panel-2: #f2efe8;
    --line: #e6e1d7;
    --ink: #23262b;
    --ink-dim: #5c6672;
    --ink-faint: #8b93a0;
    --accent: #cf8636;
    --accent-soft: rgba(207,134,54,0.14);
    --radius: 14px;
    --shadow: 0 10px 30px rgba(40,40,55,0.10);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: grid;
    grid-template-columns: 400px 1fr;
    height: 100vh;
    overflow: hidden;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    background: var(--panel);
    border-right: 1px solid var(--line);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    padding: 22px 24px 16px;
    border-bottom: 1px solid var(--line);
  }
  .brand .kicker {
    font-size: 11px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 600;
    margin: 0 0 6px;
  }
  .brand h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 30px;
    line-height: 1.05;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .brand .sub {
    margin: 8px 0 0;
    font-size: 13px;
    color: var(--ink-dim);
  }
  .sample-flag {
    margin: 14px 24px 0;
    background: var(--accent-soft);
    border: 1px solid rgba(224,164,88,0.35);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 12px;
    line-height: 1.5;
    color: #7a5220;
  }
  .sample-flag b { color: var(--accent); }

  /* Day filter chips */
  .days {
    display: flex;
    gap: 8px;
    padding: 16px 24px;
    overflow-x: auto;
    border-bottom: 1px solid var(--line);
    scrollbar-width: none;
  }
  .days::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto;
    border: 1px solid var(--line);
    background: var(--panel-2);
    color: var(--ink-dim);
    padding: 7px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s ease;
    white-space: nowrap;
  }
  .chip:hover { color: var(--ink); border-color: #3a4552; }
  .chip.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #201400;
    font-weight: 600;
  }

  /* Stop list */
  .stops {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0 32px;
    min-height: 0;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .day-group { padding: 12px 0 4px; }
  .day-head {
    padding: 6px 24px;
    display: flex;
    align-items: baseline;
    gap: 10px;
  }
  .day-head .d-num {
    font-family: 'Fraunces', serif;
    font-size: 15px;
    color: var(--accent);
    font-weight: 600;
  }
  .day-head .d-date { font-size: 12px; color: var(--ink-faint); }

  .stop {
    display: grid;
    grid-template-columns: 34px 1fr;
    gap: 12px;
    padding: 12px 24px;
    cursor: pointer;
    border-left: 3px solid transparent;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .stop:hover { background: var(--panel-2); }
  .stop.active {
    background: var(--panel-2);
    border-left-color: var(--accent);
  }
  .stop .pin {
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--ink-dim);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
    margin-top: 2px;
    transition: all 0.15s ease;
  }
  .stop.active .pin, .stop:hover .pin {
    background: var(--accent);
    border-color: var(--accent);
    color: #201400;
  }
  .stop .body h3 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .stop .body .meta {
    margin: 3px 0 0;
    font-size: 12px;
    color: var(--ink-faint);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .stop .body .tag {
    background: var(--panel);
    border: 1px solid var(--line);
    padding: 1px 7px;
    border-radius: 6px;
    color: var(--ink-dim);
  }
  .stop .body .note {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--ink-dim);
    line-height: 1.5;
  }

  /* ---------- Map ---------- */
  #map { height: 100%; width: 100%; background: #e8e4db; }
  .leaflet-container { font-family: 'Inter', sans-serif; }

  .num-marker {
    width: 30px; height: 30px;
    background: var(--accent);
    border: 2px solid #fff8ee;
    border-radius: 50% 50% 50% 2px;
    transform: rotate(45deg);
    box-shadow: 0 3px 10px rgba(0,0,0,0.4);
    display: grid;
    place-items: center;
    transition: transform 0.15s ease, background 0.15s ease;
  }
  .num-marker span {
    transform: rotate(-45deg);
    color: #201400;
    font-weight: 700;
    font-size: 13px;
    font-family: 'Inter', sans-serif;
  }
  .num-marker.dim { background: #5c6773; border-color: #cfd6de; opacity: 0.85; }
  .num-marker.active { transform: rotate(45deg) scale(1.28); background: #f4b95f; z-index: 999; }

  .leaflet-popup-content-wrapper {
    background: var(--panel);
    color: var(--ink);
    border-radius: 12px;
    box-shadow: var(--shadow);
    border: 1px solid var(--line);
  }
  .leaflet-popup-tip { background: var(--panel); border: 1px solid var(--line); }
  .leaflet-popup-content { margin: 14px 16px; font-size: 13px; line-height: 1.5; }
  .pop-kicker { font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
  .pop-title { font-family: 'Fraunces', serif; font-size: 17px; font-weight: 600; margin: 3px 0 6px; }
  .pop-note { color: var(--ink-dim); margin: 0; }
  .leaflet-popup-close-button { color: var(--ink-faint) !important; }

  /* Mobile */
  .mobile-toggle { display: none; }
  @media (max-width: 820px) {
    body { grid-template-columns: 1fr; grid-template-rows: 1fr; }
    .sidebar {
      position: absolute;
      z-index: 1000;
      inset: 0 auto 0 0;
      width: min(88vw, 400px);
      transform: translateX(-100%);
      transition: transform 0.28s cubic-bezier(.4,0,.2,1);
      box-shadow: var(--shadow);
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-toggle {
      display: grid; place-items: center;
      position: absolute; z-index: 1100; top: 14px; left: 14px;
      width: 46px; height: 46px; border-radius: 12px;
      background: var(--accent); color: #201400; border: none;
      font-size: 20px; cursor: pointer; box-shadow: var(--shadow);
    }
  }
  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>
  <button class="mobile-toggle" id="toggle" aria-label="Toggle itinerary">☰</button>
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <p class="kicker">추석 · Chuseok Trip</p>
      <h1>Autumn in Korea</h1>
      <p class="sub" id="trip-range">5 days · Seoul &amp; beyond</p>
    </div>
    <div class="sample-flag">
      <b>Sample data.</b> The attached “추석 Trip” knowledge base didn’t sync into this
      session, so these stops are placeholders. Replace the <code>ITINERARY</code> array
      near the top of the script to load your real trip.
    </div>
    <div class="days" id="days"></div>
    <div class="stops" id="stops"></div>
  </aside>
  <div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script>
/* =========================================================================
   ITINERARY  —  replace this array with your real "추석 Trip" stops.
   Each stop: { day, date, name, time, type, lat, lng, note }
   ========================================================================= */
const ITINERARY = [
  // ---- Day 1 ----
  { day:1, date:"Thu, Sep 24", time:"14:00", type:"Arrive",  name:"Incheon Int’l Airport",  lat:37.4602, lng:126.4407, note:"Land, pick up T-money card & KTX/AREX into the city." },
  { day:1, date:"Thu, Sep 24", time:"17:00", type:"Sight",   name:"Gyeongbokgung Palace",    lat:37.5796, lng:126.9770, note:"Joseon-era royal palace; catch the changing-of-the-guard." },
  { day:1, date:"Thu, Sep 24", time:"18:30", type:"Walk",    name:"Bukchon Hanok Village",   lat:37.5826, lng:126.9830, note:"Traditional hanok lanes glowing at dusk." },
  { day:1, date:"Thu, Sep 24", time:"20:00", type:"Food",    name:"Gwangjang Market",        lat:37.5701, lng:126.9998, note:"Bindaetteok & mayak gimbap for a first-night feast." },

  // ---- Day 2 ----
  { day:2, date:"Fri, Sep 25", time:"10:00", type:"Sight",   name:"N Seoul Tower (Namsan)",  lat:37.5512, lng:126.9882, note:"Cable car up Namsan for the citywide view." },
  { day:2, date:"Fri, Sep 25", time:"13:00", type:"Shop",    name:"Myeongdong",              lat:37.5637, lng:126.9850, note:"Street food + skincare; busy for Chuseok weekend." },
  { day:2, date:"Fri, Sep 25", time:"16:00", type:"Culture", name:"Insadong",                lat:37.5744, lng:126.9856, note:"Tea houses, galleries, hanji paper shops." },
  { day:2, date:"Fri, Sep 25", time:"19:00", type:"Walk",    name:"Cheonggyecheon Stream",   lat:37.5696, lng:126.9784, note:"Lantern-lit riverside stroll downtown." },

  // ---- Day 3 (day trip) ----
  { day:3, date:"Sat, Sep 26", time:"08:30", type:"Travel",  name:"Seoul → Jeonju (KTX)",    lat:35.8722, lng:127.1480, note:"~2 hr south for the classic Chuseok hanok town." },
  { day:3, date:"Sat, Sep 26", time:"11:00", type:"Sight",   name:"Jeonju Hanok Village",    lat:35.8150, lng:127.1530, note:"700+ hanok houses; rent hanbok for the day." },
  { day:3, date:"Sat, Sep 26", time:"13:00", type:"Food",    name:"Jeonju Bibimbap",         lat:35.8155, lng:127.1490, note:"The dish’s hometown — the real thing." },
  { day:3, date:"Sat, Sep 26", time:"20:00", type:"Travel",  name:"Return to Seoul",         lat:37.5547, lng:126.9707, note:"Evening KTX back to Seoul Station." },

  // ---- Day 4 ----
  { day:4, date:"Sun, Sep 27", time:"09:00", type:"Hike",    name:"Bukhansan National Park", lat:37.6584, lng:126.9779, note:"Granite-peak morning hike above the city." },
  { day:4, date:"Sun, Sep 27", time:"14:00", type:"Sight",   name:"Ihwa Mural Village",      lat:37.5796, lng:127.0060, note:"Hillside art village near Naksan Park." },
  { day:4, date:"Sun, Sep 27", time:"18:00", type:"Nightlife",name:"Hongdae",               lat:37.5563, lng:126.9236, note:"Buskers, indie shops, late-night eats." },

  // ---- Day 5 ----
  { day:5, date:"Mon, Sep 28", time:"10:00", type:"Shop",    name:"Starfield COEX Mall",     lat:37.5126, lng:127.0590, note:"Starfield Library photo stop before flying out." },
  { day:5, date:"Mon, Sep 28", time:"12:30", type:"Walk",    name:"Bongeunsa Temple",        lat:37.5150, lng:127.0577, note:"Quiet Buddhist temple amid Gangnam towers." },
  { day:5, date:"Mon, Sep 28", time:"16:00", type:"Depart",  name:"Incheon Int’l Airport",   lat:37.4602, lng:126.4407, note:"AREX to the airport; flight home." },
];

const DAY_COLORS = ['#e0a458','#6db4c9','#c98f6d','#8fb37a','#b48fc9'];

/* ---------- state ---------- */
let activeDay = 0;            // 0 = all days
let activeIndex = null;
const markers = [];
const routeLayers = [];

/* ---------- map ---------- */
const map = L.map('map', { zoomControl: true, attributionControl: true });
L.control.zoom({ position: 'bottomright' }).addTo(map);
map.zoomControl && map.removeControl(map.zoomControl);
L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; OpenStreetMap &copy; CARTO',
  maxZoom: 19,
}).addTo(map);

const days = [...new Set(ITINERARY.map(s => s.day))].sort((a,b)=>a-b);

function colorFor(day){ return DAY_COLORS[(day-1) % DAY_COLORS.length]; }

/* ---------- build markers ---------- */
ITINERARY.forEach((stop, i) => {
  const perDayNum = ITINERARY.filter(s => s.day === stop.day).indexOf(stop) + 1;
  const icon = L.divIcon({
    className: '',
    html: `<div class="num-marker" style="background:${colorFor(stop.day)}"><span>${perDayNum}</span></div>`,
    iconSize: [30,30],
    iconAnchor: [15,28],
    popupAnchor: [0,-28],
  });
  const m = L.marker([stop.lat, stop.lng], { icon }).addTo(map);
  m.bindPopup(
    `<div class="pop-kicker">Day ${stop.day} · ${stop.time}</div>
     <div class="pop-title">${stop.name}</div>
     <p class="pop-note">${stop.note}</p>`
  );
  m.on('click', () => selectStop(i, false));
  markers.push(m);
});

/* ---------- routes per day ---------- */
days.forEach(day => {
  const pts = ITINERARY.filter(s => s.day === day).map(s => [s.lat, s.lng]);
  if (pts.length > 1) {
    const line = L.polyline(pts, {
      color: colorFor(day), weight: 3, opacity: 0.55, dashArray: '2 8', lineCap: 'round'
    }).addTo(map);
    routeLayers.push({ day, line });
  }
});

/* ---------- render sidebar ---------- */
const daysEl = document.getElementById('days');
const stopsEl = document.getElementById('stops');

function renderDays(){
  daysEl.innerHTML = '';
  const all = mkChip('All days', 0);
  daysEl.appendChild(all);
  days.forEach(d => daysEl.appendChild(mkChip('Day ' + d, d)));
}
function mkChip(label, day){
  const b = document.createElement('button');
  b.className = 'chip' + (activeDay === day ? ' active' : '');
  b.textContent = label;
  b.onclick = () => { setDay(day); };
  return b;
}

function renderStops(){
  stopsEl.innerHTML = '';
  const shown = days.filter(d => activeDay === 0 || d === activeDay);
  shown.forEach(day => {
    const group = document.createElement('div');
    group.className = 'day-group';
    const first = ITINERARY.find(s => s.day === day);
    group.innerHTML = `<div class="day-head"><span class="d-num">Day ${day}</span><span class="d-date">${first.date}</span></div>`;
    ITINERARY.forEach((stop, i) => {
      if (stop.day !== day) return;
      const perDayNum = ITINERARY.filter(s => s.day === day).indexOf(stop) + 1;
      const el = document.createElement('div');
      el.className = 'stop' + (activeIndex === i ? ' active' : '');
      el.dataset.index = i;
      el.innerHTML =
        `<div class="pin" style="${activeIndex===i?'':''}">${perDayNum}</div>
         <div class="body">
           <h3>${stop.name}</h3>
           <div class="meta"><span>${stop.time}</span><span class="tag">${stop.type}</span></div>
           <p class="note">${stop.note}</p>
         </div>`;
      el.onclick = () => selectStop(i, true);
      group.appendChild(el);
    });
    stopsEl.appendChild(group);
  });
}

/* ---------- interactions ---------- */
function setDay(day){
  activeDay = day;
  activeIndex = null;
  renderDays();
  renderStops();
  // toggle route + marker visibility
  routeLayers.forEach(({day:d, line}) => {
    if (activeDay === 0 || d === activeDay) line.addTo(map); else line.remove();
  });
  markers.forEach((m, i) => {
    const s = ITINERARY[i];
    const on = activeDay === 0 || s.day === activeDay;
    m.setOpacity(on ? 1 : 0.18);
    const el = m.getElement()?.querySelector('.num-marker');
    if (el) el.classList.toggle('dim', !on);
  });
  fitTo(activeDay);
}

function selectStop(i, fromList){
  activeIndex = i;
  renderStops();
  // marker highlight
  markers.forEach((m, j) => {
    const el = m.getElement()?.querySelector('.num-marker');
    if (el) el.classList.toggle('active', j === i);
  });
  const s = ITINERARY[i];
  map.flyTo([s.lat, s.lng], Math.max(map.getZoom(), 13), { duration: 0.6 });
  markers[i].openPopup();
  if (fromList) {
    const card = stopsEl.querySelector(`.stop[data-index="${i}"]`);
    card && card.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } else {
    document.getElementById('sidebar')?.classList.remove('open');
  }
}

function fitTo(day){
  const pts = ITINERARY.filter(s => day === 0 || s.day === day).map(s => [s.lat, s.lng]);
  if (pts.length) map.fitBounds(pts, { padding: [70,70], maxZoom: 13 });
}

/* ---------- trip range label ---------- */
(function(){
  const d = ITINERARY;
  document.getElementById('trip-range').textContent =
    `${days.length} days · ${d[0].date} – ${d[d.length-1].date}`;
})();

/* ---------- mobile toggle ---------- */
document.getElementById('toggle').onclick = () =>
  document.getElementById('sidebar').classList.toggle('open');

/* ---------- init ---------- */
renderDays();
renderStops();
fitTo(0);
</script>
</body>
</html>
